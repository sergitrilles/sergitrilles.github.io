name: Actualizar datos

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar el acceso
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Falta el secreto PRIVATE_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: sergitrilles/web-cv-privado
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: .privado

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar
        env:
          SITE_DIR: ${{ github.workspace }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
          SCOPUS_INSTTOKEN: ${{ secrets.SCOPUS_INSTTOKEN }}
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python .privado/tools/update_cv.py | grep -i "error" || true

      - name: Publicar
        run: |
          rm -rf .privado
          git config user.name "Sergi Trilles"
          git config user.email "sergitrilles@users.noreply.github.com"
          git add data/cv.json
          git diff --cached --quiet || { git commit -m "Actualiza datos"; git push; }
